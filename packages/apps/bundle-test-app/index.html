<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bundle token test app</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 64rem; padding: 1.5rem 2rem 4rem; line-height: 1.5; color: #1f2937; }
      h1 { margin-bottom: 0.5rem; }
      section { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1.25rem 1.5rem; margin: 1.5rem 0; background: #fff; }
      h2 { margin: 0 0 1rem; font-size: 1.2rem; }
      h3 { margin: 1.25rem 0 0.5rem; font-size: 1rem; }
      p { margin: 0.5rem 0; }
      button { padding: 0.4rem 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc; cursor: pointer; font: inherit; font-size: 0.9rem; text-align: left; }
      button:hover:not(:disabled) { background: #eef2f7; }
      button:disabled { opacity: 0.55; cursor: default; }
      input, select { padding: 0.35rem 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
      label { display: inline-block; margin-bottom: 0.25rem; }
      pre { background: #f5f5f5; border-radius: 6px; padding: 0.75rem; margin: 0.5rem 0 0; overflow: auto; max-height: 28rem; font-size: 0.8rem; }
      .ok { color: #17803d; } .err { color: #b91c1c; } .muted { color: #6b7280; font-size: 0.9em; }
      table { border-collapse: collapse; } td, th { padding: 0.35rem 1rem 0.35rem 0; text-align: left; vertical-align: top; }
      code { font-size: 0.85em; }
      .actions { margin-top: 1rem; }
      .action { display: grid; grid-template-columns: minmax(18rem, 22rem) 1fr; gap: 0.5rem 1.25rem; padding: 1rem 0; border-top: 1px solid #eef0f3; }
      .action:first-child { border-top: none; padding-top: 0.25rem; }
      .action-button button { width: 100%; }
      .action-description { color: #4b5563; font-size: 0.92rem; }
      .action-result { grid-column: 1 / -1; }
      .result > div:first-child { font-weight: 600; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
